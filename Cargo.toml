[package]
name = "k0maru-workspace"
version = "0.1.0"
edition = "2021"
description = "Git Worktree isolation and ephemeral sandbox lifecycle engine for K0maru-Harness"
authors = ["k0maru3"]

[lib]
name = "k0maru_workspace"
path = "src/lib.rs"

[[bin]]
name = "k0maru-workspace"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "cargo"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
thiserror = "1.0"
anyhow = "1.0"
uuid = { version = "1.8", features = ["v4", "serde"] }
async-trait = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "io-util", "fs", "process"] }
regex = "1.10"
tempfile = "3.10"
sha2 = "0.11.0"
hex = "0.4.3"

[dev-dependencies]
tempfile = "3.10"
assert_cmd = "2.0"
predicates = "3.1"

